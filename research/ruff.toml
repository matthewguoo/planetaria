# Same correctness-only lint as backend/ruff.toml: F (pyflakes) catches
# undefined names, unused imports and redefinitions; E9 catches syntax and
# indentation errors. Style is deliberately not enforced here — these are
# study scripts whose comments carry the argument, and a formatter that
# rewraps them loses the argument.
# Run: ruff check research/
target-version = "py313"

[lint]
select = ["F", "E9"]
