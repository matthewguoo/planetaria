# CLI entry point for migrations (programmatic runs from app.db.session build
# their Config in code and ignore this file). Usage from backend/:
#   .venv\Scripts\alembic revision -m "add thing"
#   .venv\Scripts\alembic upgrade head -x db_url=sqlite+aiosqlite:///./trader.db
[alembic]
script_location = migrations
prepend_sys_path = .
# Resolved by migrations/env.py: -x db_url=... , else app Settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
